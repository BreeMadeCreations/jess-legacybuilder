name: Generate social preview

on:
  push:
    branches: [main]
    paths:
      - "assets/jess-preview.svg"
      - "assets/jessica-cabello.webp"
      - ".github/workflows/generate-social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          pip install pillow cairosvg

      - name: Render preview image
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import cairosvg

          cairosvg.svg2png(
              url="assets/jess-preview.svg",
              write_to="assets/jess-preview.png",
              output_width=1200,
              output_height=630
          )

          card = Image.open("assets/jess-preview.png").convert("RGBA")
          photo = Image.open("assets/jessica-cabello.webp").convert("RGB")
          fitted = ImageOps.fit(
              photo,
              (470, 630),
              method=Image.Resampling.LANCZOS,
              centering=(0.50, 0.28)
          ).convert("RGBA")

          card.paste(fitted, (0, 0))
          draw = ImageDraw.Draw(card)
          draw.arc((325, -90, 610, 720), 90, 270, fill=(231, 207, 174, 255), width=5)

          card.convert("RGB").save("assets/jess-preview.png", "PNG", optimize=True)
          PY

      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jess-preview.png
          if git diff --cached --quiet; then
            echo "Preview already up to date."
          else
            git commit -m "Fix shared link preview photo"
            git push
          fi
